# CI for icm-shipwright itself: the full fixture suite (lint checks, export
# guardrails, attack cases, icm-scope) on GNU (ubuntu) and BSD (macos) tools.
name: ci
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
